
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Multimedia - Audio</title>
</head>

<body>

    <h1>HTML Multimedia - Audio & Video</h1>

    <h2>1. Simple Audio</h2>
    <audio src="./audio.mp3" controls></audio>

    <br><br>

    <h2>2. Auto Play Audio</h2>
    <audio src="./audio.mp3" controls autoplay muted></audio>

    <br><br>

    <h2>3. Loop Audio</h2>
    <audio src="./audio.mp3" controls loop></audio>
    <br><br>
    
    <h2>4. Simple video</h2>
    <video width="400" height="200" src="./video.mp4" controls></video>
    <br><br>

    <h2>5. Auto Play Video</h2>
    <video width="400" height="200" src="./video.mp4" controls autoplay muted></video>
    <br><br>

    <h2>6. Loop Video</h2>
    <video width="400" height="200" src="./video.mp4" controls loop></video>    
   
    <h2>7. Video with Poster</h2>
    <video width="400" height="200" src="./video.mp4" controls poster="./poster.jpg"></video>    

    <h2>8. Embedded Video</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/tdHzl4L8gFs?si=XDeS1mGyK-koUtci" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>

</html>
