<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Code With Ajit</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #06142e, #0b3d91, #00a8ff);
            display: flex;
            flex-direction: column;
            color: white;
        }

        /* Header */
        header {
            width: 100%;
            padding: 18px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .logo img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #9eeaff;
        }

        /* Signup Section */
        .signup-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .signup-box h2 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #d9f7ff;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: none;
            outline: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #222;
        }

        input:focus,
        select:focus {
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.4);
        }

        /* Gender */
        .gender-title {
            margin-bottom: 10px;
        }

        .gender {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }

        .gender label {
            display: inline;
            margin: 0;
            font-weight: normal;
        }

        .gender input {
            accent-color: #00c6ff;
        }

        /* Terms */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 22px;
            font-weight: normal;
            line-height: 1.4;
        }

        .terms input {
            margin-top: 4px;
            accent-color: #00c6ff;
        }

        .terms label {
            font-weight: normal;
            margin: 0;
        }

        /* Button */
        input[type="submit"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #00c6ff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background: #008cff;
            transform: translateY(-2px);
        }

        /* Login */
        .login-text {
            text-align: center;
            margin-top: 25px;
        }

        .login-text a {
            color: #9eeaff;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.25);
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                text-align: center;
            }

            nav a {
                margin: 0 6px;
                font-size: 13px;
            }

            .signup-box {
                padding: 30px 22px;
            }

            .signup-box h2 {
                font-size: 28px;
            }

            .gender {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            <img src="./image.png" alt="Code With Ajit Logo">
            <span>Code With Ajit</span>
        </div>

        <nav>
            <a href="./index.html">Home</a>
            <a href="./about.html">About</a>
             <a href="./projects.html">Projects</a>
            <a href="./contact.html">Contact</a>
            <a href="./media.html">Media</a>
            <a href="./login.html">Login</a>
        </nav>

    </header>


    <!-- Signup Section -->
    <section class="signup-section">

        <div class="signup-box">

            <h2>Create Account 🚀</h2>

            <p class="subtitle">
                Join Code With Ajit
            </p>


            <form action="">

                <!-- Username -->
                <label for="username">Username:</label>

                <input type="text" id="username" name="username" placeholder="Enter your username" required>


                <!-- Email -->
                <label for="email">Email:</label>

                <input type="email" id="email" name="email" placeholder="Enter your email" required>


                <!-- Password -->
                <label for="password">Password:</label>

                <input type="password" id="password" name="password" placeholder="Create a password" required>


                <!-- Confirm Password -->
                <label for="confirm-password">
                    Confirm Password:
                </label>

                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password"
                    required>


                <!-- Date of Birth -->
                <label for="dob">Date of Birth:</label>

                <input type="date" id="dob" name="dob" required>


                <!-- Gender -->
                <label class="gender-title">Gender:</label>

                <div class="gender">

                    <input type="radio" id="male" name="gender" value="male">

                    <label for="male">Male</label>


                    <input type="radio" id="female" name="gender" value="female">

                    <label for="female">Female</label>

                </div>


                <!-- Role -->
                <label for="role">Select Role:</label>

                <select id="role" name="role">

                    <option value="">
                        -- Select Role --
                    </option>

                    <option value="user">
                        User
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>


                <!-- Terms -->
                <div class="terms">

                    <input type="checkbox" id="terms" name="terms" required>

                    <label for="terms">
                        I agree to the terms and conditions
                    </label>

                </div>


                <!-- Submit -->
                <input type="submit" value="Create Account">

            </form>


            <p class="login-text">
                Already have an account?
                <a href="./login.html">Login</a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        © 2026 Code With Ajit. All rights reserved.
    </footer>

</body>

</html>
