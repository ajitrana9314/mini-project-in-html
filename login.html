<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Code With Ajit</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #06142e, #0b3d91, #00a8ff);
            display: flex;
            flex-direction: column;
            color: white;
        }

        /* Header */
        header {
            width: 100%;
            padding: 20px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(59, 76, 148, 0.25);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .logo img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        nav a {
            color: rgb(252, 252, 252);
            text-decoration: none;
            margin-left: 22px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #9eeaff;
        }

        /* Login Section */
        .login-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .login-box h2 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #d9f7ff;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: none;
            outline: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #222;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.4);
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #00c6ff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background: #008cff;
            transform: translateY(-2px);
        }

        .signup-text {
            text-align: center;
            margin-top: 25px;
        }

        .signup-text a {
            color: #9eeaff;
            font-weight: bold;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.25);
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 7px;
                font-size: 14px;
            }

            .login-box {
                padding: 30px 22px;
            }

            .login-box h2 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            <img src="./image.png" alt="Code With Ajit Logo">
            <span>Code With Ajit</span>
        </div>

        <nav>
            <a href="./index.html">Home</a>
            <a href="./about.html">About</a>
             <a href="./projects.html">Projects</a>
            <a href="./contact.html">Contact</a>
            <a href="./media.html">Media</a>
            <a href="./signup.html">Sign Up</a>
        </nav>

    </header>


    <!-- Login -->
    <section class="login-section">

        <div class="login-box">

            <h2>Welcome Back 👋</h2>

            <p class="subtitle">
                Login to your account
            </p>

            <form action="">

                <label for="username">Username:</label>

                <input type="text" id="username" name="username" placeholder="Enter your username" required>


                <label for="password">Password:</label>

                <input type="password" id="password" name="password" placeholder="Enter your password" required>


                <input type="submit" value="Login">

            </form>


            <p class="signup-text">
                New account?
                <a href="./signup.html">Sign Up</a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        © 2026 Code With Ajit. All rights reserved.
    </footer>

</body>

</html>
